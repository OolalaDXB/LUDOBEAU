async function sha256Hex(str) {
  const data = new TextEncoder().encode(str);
  const buf = await crypto.subtle.digest("SHA-256", data);
  return [...new Uint8Array(buf)].map((b) => b.toString(16).padStart(2, "0")).join("");
}
function makeSalt() {
  const a = new Uint8Array(8); crypto.getRandomValues(a);
  return [...a].map((b) => b.toString(16).padStart(2, "0")).join("");
}
const canonical = (p, d, c, s) => `${p.trim()}\u241F${d}\u241F${c}\u241F${s}`;
function b64enc(obj) { return "BEAU1:" + btoa(unescape(encodeURIComponent(JSON.stringify(obj)))); }
function b64dec(tok) { return JSON.parse(decodeURIComponent(escape(atob(tok.trim().replace(/^BEAU1:/, ""))))); }

const KEY = "beau_paris";
const loadBets = () => { try { return JSON.parse(localStorage.getItem(KEY) || "[]"); } catch (e) { return []; } };
const saveBets = (b) => { try { localStorage.setItem(KEY, JSON.stringify(b)); } catch (e) {} };
const shortSeal = (h) => h.slice(0, 8) + "·" + h.slice(8, 16) + "·" + h.slice(-8);
function copy(text, done) { try { navigator.clipboard.writeText(text).then(() => done && done(), () => done && done()); } catch (e) { done && done(); } }

function BeauPariScelle({ lang = "fr" }) {
  const t = STR[lang] || STR.fr;
  const fmtDate = (iso) => { if (!iso) return "—"; return new Date(iso).toLocaleDateString(t.locale, { day: "2-digit", month: "long", year: "numeric" }); };

  const [tab, setTab] = useState("new");
  const [bets, setBets] = useState(loadBets);
  const [pred, setPred] = useState("");
  const [deadline, setDeadline] = useState("");
  const [stake, setStake] = useState("");
  const [busy, setBusy] = useState(false);
  const [flash, setFlash] = useState("");
  const [verifyTok, setVerifyTok] = useState("");
  const [verifyRes, setVerifyRes] = useState(null);
  const [line, setLine] = useState(t.voiceIdle);

  useEffect(() => { saveBets(bets); }, [bets]);
  useEffect(() => { setLine((cur) => (cur === STR.fr.voiceIdle || cur === STR.en.voiceIdle) ? t.voiceIdle : cur); }, [lang]); // eslint-disable-line
  const toast = (m) => { setFlash(m); setTimeout(() => setFlash(""), 2200); };

  const seal = async () => {
    if (!pred.trim()) { setLine(t.needPred); return; }
    if (!deadline) { setLine(t.needDate); return; }
    setBusy(true);
    const createdAt = new Date().toISOString();
    const salt = makeSalt();
    const hash = await sha256Hex(canonical(pred, deadline, createdAt, salt));
    const bet = { id: createdAt + "-" + salt.slice(0, 4), pred: pred.trim(), deadline, stake: stake.trim(), createdAt, salt, hash, revealed: false, outcome: null };
    setBets((b) => [bet, ...b]);
    setPred(""); setStake(""); setBusy(false); setTab("mine");
    setLine(t.sealedLine);
  };
  const shareSeal = (bet) => copy(t.shareSealMsg(bet.hash, fmtDate(bet.deadline), bet.stake), () => toast(t.copiedSeal));
  const revealShare = (bet) => {
    const tok = b64enc({ p: bet.pred, d: bet.deadline, c: bet.createdAt, s: bet.salt, h: bet.hash, m: bet.stake });
    setBets((b) => b.map((x) => (x.id === bet.id ? { ...x, revealed: true } : x)));
    copy(tok, () => toast(t.copiedProof));
    setLine(t.revealedLine);
  };
  const setOutcome = (bet, o) => setBets((b) => b.map((x) => (x.id === bet.id ? { ...x, outcome: o } : x)));
  const remove = (bet) => setBets((b) => b.filter((x) => x.id !== bet.id));

  const doVerify = async () => {
    setVerifyRes(null);
    let o;
    try { o = b64dec(verifyTok); } catch (e) { setVerifyRes({ ok: false, reason: t.badFormat }); return; }
    if (!o || !o.p || !o.h) { setVerifyRes({ ok: false, reason: t.incomplete }); return; }
    const recomputed = await sha256Hex(canonical(o.p, o.d, o.c, o.s));
    const ok = recomputed === o.h;
    setVerifyRes({ ok, pred: o.p, deadline: o.d, createdAt: o.c, stake: o.m, seal: o.h });
    setLine(ok ? t.okLine : t.koLine);
  };

  return (
    <div style={S.page}>
      <style>{CSS}</style>
      <div style={S.shell}>
        <header style={S.head}>
          <div style={S.brand}>BEAU</div>
          <div style={S.title}>{t.title}</div>
          <div style={S.eyebrow}>{t.eyebrow}</div>
          <div style={S.hair} />
        </header>

        <div style={S.tabs}>
          <button onClick={() => setTab("new")} style={{ ...S.tab, ...(tab === "new" ? S.tabOn : {}) }}>{t.tabNew}</button>
          <button onClick={() => setTab("mine")} style={{ ...S.tab, ...(tab === "mine" ? S.tabOn : {}) }}>{t.tabMine}{bets.length ? ` · ${bets.length}` : ""}</button>
          <button onClick={() => setTab("verify")} style={{ ...S.tab, ...(tab === "verify" ? S.tabOn : {}) }}>{t.tabVerify}</button>
        </div>

        <div style={S.voice}><span style={S.voiceMark}>{t.dash}</span><span style={S.voiceText}>{line}</span></div>

        {tab === "new" && (
          <div style={S.card}>
            <label style={S.label}>{t.labelPred}</label>
            <textarea value={pred} onChange={(e) => setPred(e.target.value)} rows={3} placeholder={t.phPred} style={S.textarea} />
            <div style={S.row}>
              <div style={{ flex: 1 }}>
                <label style={S.label}>{t.labelDeadline}</label>
                <input type="date" value={deadline} onChange={(e) => setDeadline(e.target.value)} style={S.input} />
              </div>
              <div style={{ flex: 1 }}>
                <label style={S.label}>{t.labelStake}</label>
                <input value={stake} onChange={(e) => setStake(e.target.value)} placeholder={t.phStake} style={S.input} />
              </div>
            </div>
            <button onClick={seal} disabled={busy} style={S.seal}>{busy ? t.sealing : t.sealBtn}</button>
            <div style={S.fine}>{t.fineNew}</div>
          </div>
        )}

        {tab === "mine" && (
          <div style={S.list}>
            {bets.length === 0 && <div style={S.empty}>{t.empty}</div>}
            {bets.map((bet) => {
              const past = bet.deadline && new Date(bet.deadline) <= new Date();
              return (
                <div key={bet.id} style={S.bet}>
                  <div style={S.betTop}>
                    <span style={{ ...S.badge, ...(bet.revealed ? S.badgeRev : {}) }}>{bet.revealed ? t.revealed : t.sealed}</span>
                    <span style={S.betDate}>{past ? t.deadlineReached : ""}{fmtDate(bet.deadline)}</span>
                  </div>
                  <div style={S.betPred}>{bet.pred}</div>
                  {bet.stake && <div style={S.betStake}>{t.stake}{bet.stake}</div>}
                  <div style={S.sealLine} title={bet.hash}>{t.seal}{shortSeal(bet.hash)}</div>
                  {bet.outcome && <div style={{ ...S.outcome, color: bet.outcome === "won" ? C.good : C.bad }}>{t.outcome}{bet.outcome === "won" ? t.won : t.lost}</div>}
                  <div style={S.betActions}>
                    <button onClick={() => shareSeal(bet)} style={S.ghost}>{t.shareSeal}</button>
                    <button onClick={() => revealShare(bet)} style={S.ghost}>{bet.revealed ? t.recopy : t.revealShare}</button>
                    {past && !bet.outcome && (<>
                      <button onClick={() => setOutcome(bet, "won")} style={S.win}>{t.won}</button>
                      <button onClick={() => setOutcome(bet, "lost")} style={S.lose}>{t.lost}</button>
                    </>)}
                    <button onClick={() => remove(bet)} style={S.del}>{t.del}</button>
                  </div>
                </div>
              );
            })}
          </div>
        )}

        {tab === "verify" && (
          <div style={S.card}>
            <label style={S.label}>{t.labelToken}</label>
            <textarea value={verifyTok} onChange={(e) => setVerifyTok(e.target.value)} rows={3} placeholder="BEAU1:…" style={S.textarea} />
            <button onClick={doVerify} style={S.seal}>{t.verifyBtn}</button>
            {verifyRes && (
              <div style={{ ...S.verify, borderColor: verifyRes.ok ? C.good : C.bad }}>
                <div style={{ ...S.verdict, color: verifyRes.ok ? C.good : C.bad }}>{verifyRes.ok ? t.authentic : t.notMatch}</div>
                {verifyRes.reason && <div style={S.fine}>{verifyRes.reason}</div>}
                {verifyRes.pred && (<>
                  <div style={S.vRow}><span style={S.vKey}>{t.vPred}</span><span>{verifyRes.pred}</span></div>
                  <div style={S.vRow}><span style={S.vKey}>{t.vSealed}</span><span>{fmtDate(verifyRes.createdAt)}</span></div>
                  <div style={S.vRow}><span style={S.vKey}>{t.vDeadline}</span><span>{fmtDate(verifyRes.deadline)}</span></div>
                  {verifyRes.stake && <div style={S.vRow}><span style={S.vKey}>{t.vStake}</span><span>{verifyRes.stake}</span></div>}
                  <div style={S.vRow}><span style={S.vKey}>{t.vSeal}</span><span style={S.mono}>{shortSeal(verifyRes.seal)}</span></div>
                </>)}
              </div>
            )}
            <div style={S.fine}>{t.fineVerify}</div>
          </div>
        )}

        {flash && <div style={S.flash}>{flash}</div>}
      </div>
    </div>
  );
}

const PSTR = {
  fr: { roomTitle:"La salle de jeux", roomEyebrow:"LE SOUFFLEUR", enterLine:"— Entrez votre nom, et prenez place à la table.", namePh:"Votre nom", enterBtn:"Entrer",
        hello:(n)=>`Bonjour ${n}`, hubEyebrow:"LA SALLE DE JEUX DU SOUFFLEUR", choose:(n)=>`Choisissez votre table, ${n}.`,
        footer:"BEAU · une table de jeux, pas une salle d'arcade.", logout:"Changer de nom", back:"‹ Jeux", defaultName:"Armateur" },
  en: { roomTitle:"The games room", roomEyebrow:"THE PROMPTER", enterLine:"— Enter your name, and take your seat at the table.", namePh:"Your name", enterBtn:"Enter",
        hello:(n)=>`Hello ${n}`, hubEyebrow:"THE PROMPTER'S GAMES ROOM", choose:(n)=>`Choose your table, ${n}.`,
        footer:"BEAU · a games table, not an arcade.", logout:"Change name", back:"‹ Games", defaultName:"Skipper" },
};
const GAMES = [
  { id:"echecs", emblem:EmbEchecs, comp:Echecs, fr:{name:"Échecs",desc:"À deux, ou contre le Souffleur.",tag:"1–2 joueurs"}, en:{name:"Chess",desc:"Two players, or against the Prompter.",tag:"1–2 players"} },
  { id:"tawla", emblem:EmbTawla, comp:Tawla, fr:{name:"Tawla",desc:"Le backgammon — règles incluses.",tag:"1 joueur"}, en:{name:"Tawla",desc:"Backgammon — rules included.",tag:"1 player"} },
  { id:"sudoku", emblem:EmbSudoku, comp:Sudoku, fr:{name:"Sudoku",desc:"Grilles à solution unique.",tag:"1 joueur"}, en:{name:"Sudoku",desc:"Unique-solution grids.",tag:"1 player"} },
  { id:"escales", emblem:EmbEscales, comp:Escales, fr:{name:"Escales",desc:"Armateur en mer — à plusieurs.",tag:"2–4 joueurs"}, en:{name:"Ports of Call",desc:"Shipowner at sea — for several.",tag:"2–4 players"} },
  { id:"p4", emblem:EmbP4, comp:Puissance4, fr:{name:"Puissance 4",desc:"À deux ou contre le Souffleur.",tag:"1–2 joueurs"}, en:{name:"Connect Four",desc:"Two players or against the Prompter.",tag:"1–2 players"} },
  { id:"quiz", emblem:EmbQuiz, comp:Quiz, fr:{name:"Quiz du Souffleur",desc:"Un dilemme patrimonial par semaine.",tag:"hebdomadaire"}, en:{name:"The Prompter's Quiz",desc:"One wealth dilemma each week.",tag:"weekly"} },
  { id:"pari", emblem:EmbPari, comp:Pari, fr:{name:"Le pari scellé",desc:"Engagez-vous, scellez, partagez.",tag:"vérifiable"}, en:{name:"The Sealed Wager",desc:"Commit, seal, share.",tag:"verifiable"} },
];

function LangToggle({lang, onChange}){
  return (
    <div style={H.lang}>
      <button onClick={()=>onChange("fr")} style={{...H.langBtn, ...(lang==="fr"?H.langOn:{})}}>FR</button>
      <button onClick={()=>onChange("en")} style={{...H.langBtn, ...(lang==="en"?H.langOn:{})}}>EN</button>
    </div>
  );
}

function BeauJeux(){
  const readName = () => { try { return localStorage.getItem("beau_name") || ""; } catch(e){ return ""; } };
  const readLang = () => { try { return localStorage.getItem("beau_lang") || "fr"; } catch(e){ return "fr"; } };
  const [lang, setLang] = useState(readLang);
  const [name, setName] = useState(readName);
  const [entered, setEntered] = useState(() => !!readName());
  const [draft, setDraft] = useState("");
  const [active, setActive] = useState(null);
  const P = PSTR[lang] || PSTR.fr;
  const changeLang = (l) => { setLang(l); try { localStorage.setItem("beau_lang", l); } catch(e){} };
  const enter = () => { const n = (draft || P.defaultName).trim(); setName(n); setEntered(true); try { localStorage.setItem("beau_name", n); } catch(e){} };
  const logout = () => { setEntered(false); setActive(null); setDraft(""); try { localStorage.removeItem("beau_name"); } catch(e){} };

  if (!entered) {
    return (
      <div style={H.portal}><div style={H.portalCard}>
        <div style={H.brandBig}>BEAU</div>
        <div style={H.portalTitle}>{P.roomTitle}</div>
        <div style={H.eyebrow}>{P.roomEyebrow}</div>
        <div style={{display:"flex",justifyContent:"center",marginTop:12}}><LangToggle lang={lang} onChange={changeLang} /></div>
        <div style={H.hairline} />
        <div style={H.portalLine}>{P.enterLine}</div>
        <input value={draft} onChange={(e)=>setDraft(e.target.value)} onKeyDown={(e)=>{ if(e.key==="Enter") enter(); }} placeholder={P.namePh} style={H.input} autoFocus />
        <button onClick={enter} style={H.enterBtn}>{P.enterBtn}</button>
      </div></div>
    );
  }
  if (active) {
    const G = GAMES.find((g)=>g.id===active); const Comp = G.comp;
    return (<div style={{position:"relative", minHeight:"100vh"}}><button onClick={()=>setActive(null)} style={H.back}>{P.back}</button><Comp lang={lang} /></div>);
  }
  return (
    <div style={H.page}><div style={H.shell}>
      <div style={{position:"absolute", top:18, right:18}}><LangToggle lang={lang} onChange={changeLang} /></div>
      <header style={H.head}>
        <div style={H.brand}>BEAU</div>
        <div style={H.title}>{P.hello(name)}</div>
        <div style={H.eyebrow}>{P.hubEyebrow}</div>
        <div style={H.hairline} />
      </header>
      <div style={H.intro}><span style={{color:HC.terra,fontSize:20,lineHeight:1}}>—</span><span style={{fontStyle:"italic",fontSize:19}}>{P.choose(name)}</span></div>
      <div style={H.grid}>
        {GAMES.map((g)=>{ const E=g.emblem; const L=g[lang]||g.fr; return (
          <button key={g.id} onClick={()=>setActive(g.id)} style={H.card} className="card">
            <div style={{marginBottom:8}}><E/></div>
            <div style={H.cardName}>{L.name}</div>
            <div style={H.cardDesc}>{L.desc}</div>
            <div style={H.cardTag}>{L.tag}</div>
          </button>); })}
      </div>
      <footer style={H.foot}><span>{P.footer}</span><button onClick={logout} style={H.logout}>{P.logout}</button></footer>
    </div></div>
  );
}

const H = {
  portal: { minHeight:"100vh", background:`radial-gradient(120% 120% at 50% 0%, #F6F0E4 0%, ${HC.bg} 60%)`, display:"flex", alignItems:"center", justifyContent:"center", padding:"24px 16px" },
  portalCard: { width:"min(92vw, 380px)", textAlign:"center", background:HC.panel, border:`1px solid ${HC.hair}`, borderRadius:6, padding:"34px 26px 28px", boxShadow:"0 30px 56px -34px rgba(32,30,25,0.5)" },
  brandBig: { fontFamily:"ui-sans-serif, system-ui, sans-serif", fontSize:16, fontWeight:600, letterSpacing:"0.5em", paddingLeft:"0.5em" },
  portalTitle: { fontSize:32, fontStyle:"italic", marginTop:10, lineHeight:1 },
  portalLine: { fontStyle:"italic", fontSize:17, color:HC.muted, margin:"6px 0 18px" },
  input: { width:"100%", padding:"13px 14px", border:`1px solid ${HC.hair}`, borderRadius:3, background:HC.paper, fontSize:18, color:HC.ink, fontFamily:"'Cormorant Garamond',serif", textAlign:"center", boxSizing:"border-box" },
  enterBtn: { width:"100%", marginTop:12, padding:"13px", border:"none", borderRadius:3, background:HC.terra, color:"#FBF7EF", fontFamily:"ui-sans-serif, system-ui, sans-serif", fontSize:11, letterSpacing:"0.18em", textTransform:"uppercase", cursor:"pointer" },
  lang: { display:"inline-flex", gap:2, border:`1px solid ${HC.hair}`, borderRadius:999, padding:2, background:"rgba(251,246,234,0.7)" },
  langBtn: { fontFamily:"ui-sans-serif, system-ui, sans-serif", fontSize:10, letterSpacing:"0.12em", padding:"5px 11px", border:"none", borderRadius:999, background:"transparent", color:HC.muted, cursor:"pointer" },
  langOn: { background:HC.ink, color:HC.bg },
  page: { position:"relative", minHeight:"100vh", background:`radial-gradient(120% 120% at 50% 0%, #F6F0E4 0%, ${HC.bg} 60%)`, display:"flex", alignItems:"flex-start", justifyContent:"center", padding:"44px 16px" },
  shell: { width:"min(92vw, 720px)" },
  head: { textAlign:"center", marginBottom:16 },
  brand: { fontFamily:"ui-sans-serif, system-ui, sans-serif", fontSize:14, fontWeight:600, letterSpacing:"0.46em", paddingLeft:"0.46em" },
  title: { fontSize:36, fontStyle:"italic", marginTop:10, lineHeight:1 },
  eyebrow: { fontFamily:"ui-sans-serif, system-ui, sans-serif", fontSize:10, letterSpacing:"0.3em", color:HC.muted, marginTop:9, paddingLeft:"0.3em" },
  hairline: { height:1, background:HC.hair, margin:"18px auto 0", width:"100%" },
  intro: { display:"flex", gap:10, alignItems:"baseline", justifyContent:"center", margin:"16px 0 22px" },
  grid: { display:"grid", gridTemplateColumns:"repeat(auto-fill, minmax(155px, 1fr))", gap:12 },
  card: { textAlign:"left", cursor:"pointer", border:`1px solid ${HC.hair}`, borderRadius:5, background:HC.panel, padding:"16px 16px 14px", display:"flex", flexDirection:"column", gap:4, color:HC.ink, boxShadow:"0 1px 0 rgba(255,255,255,0.6) inset" },
  cardName: { fontSize:21, fontWeight:500, lineHeight:1.1 },
  cardDesc: { fontSize:15.5, color:HC.muted, lineHeight:1.3, minHeight:40 },
  cardTag: { fontFamily:"ui-sans-serif, system-ui, sans-serif", fontSize:9.5, letterSpacing:"0.14em", textTransform:"uppercase", color:HC.terra, marginTop:4 },
  foot: { display:"flex", alignItems:"center", justifyContent:"space-between", gap:10, flexWrap:"wrap", marginTop:26, fontStyle:"italic", fontSize:15, color:HC.muted },
  logout: { fontFamily:"ui-sans-serif, system-ui, sans-serif", fontSize:9.5, letterSpacing:"0.14em", textTransform:"uppercase", padding:"7px 12px", border:`1px solid ${HC.hair}`, borderRadius:999, background:"transparent", color:HC.muted, cursor:"pointer" },
  back: { position:"fixed", top:14, left:14, zIndex:50, fontFamily:"ui-sans-serif, system-ui, sans-serif", fontSize:11, letterSpacing:"0.12em", textTransform:"uppercase", padding:"8px 14px", border:`1px solid ${HC.hair}`, borderRadius:999, background:"rgba(251,246,234,0.92)", backdropFilter:"blur(6px)", color:HC.ink, cursor:"pointer", boxShadow:"0 6px 18px -10px rgba(32,30,25,0.5)" },
};
ReactDOM.createRoot(document.getElementById("root")).render(<BeauJeux/>);
</script>
</body>
</html>
